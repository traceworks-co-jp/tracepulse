name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tracepulse-windows-x86_64.zip
            binary: tracepulse.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tracepulse-linux-x86_64.tar.gz
            binary: tracepulse
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tracepulse-macos-x86_64.tar.gz
            binary: tracepulse

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend assets
        run: |
          npm run typecheck
          npm run build:web
          git diff --exit-code -- frontend/dist

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" release-package/
          Copy-Item -Recurse templates release-package/templates
          Compress-Archive -Path release-package/* -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" release-package/
          cp -R templates release-package/templates
          tar -czf "${{ matrix.archive }}" -C release-package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true