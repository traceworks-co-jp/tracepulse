name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            archive: tracepulse-windows-x86_64.zip
            binary: tracepulse.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tracepulse-linux-x86_64.tar.gz
            binary: tracepulse
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tracepulse-macos-x86_64.tar.gz
            binary: tracepulse
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tracepulse-macos-aarch64.tar.gz
            binary: tracepulse

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend assets
        run: |
          npm run typecheck
          npm run build:web
          git diff --exit-code -- frontend/dist

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # --- Windows コード署名処理 ---
      - name: Setup .NET (for AzureSignTool)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install AzureSignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global AzureSignTool --version 6.0.0

      - name: Azure Login (OIDC)
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Key Vault Access Token
        if: runner.os == 'Windows'
        id: get_token
        shell: pwsh
        run: |
          $token = az account get-access-token --resource "https://vault.azure.net" --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Failed to obtain a Key Vault access token."
          }
          Write-Output "::add-mask::$token"
          Add-Content -Path $env:GITHUB_ENV -Value "KEYVAULT_TOKEN=$token"

      - name: Sign Executable with AzureSignTool
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          AzureSignTool sign `
            -kvu "https://$($env:AZURE_KEYVAULT_NAME).vault.azure.net" `
            -kvc "$env:AZURE_CERT_NAME" `
            -kva "$env:KEYVAULT_TOKEN" `
            -fd sha256 `
            -tr "http://timestamp.digicert.com" `
            -td sha256 `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Executable signing failed."
          }

      - name: Verify Signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }
          & $signtool.FullName verify /v /pa "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Executable signature verification failed."
          }
      # --- ここまでコード署名 ---

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" release-package/
          Copy-Item -Recurse templates release-package/templates
          Copy-Item LICENSE-MIT,LICENSE-APACHE,SECURITY.md,THIRD_PARTY_LICENSES.html release-package/
          Compress-Archive -Path release-package/* -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" release-package/
          cp -R templates release-package/templates
          cp LICENSE-MIT LICENSE-APACHE SECURITY.md THIRD_PARTY_LICENSES.html release-package/
          tar -czf "${{ matrix.archive }}" -C release-package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload signed executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-executable
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true