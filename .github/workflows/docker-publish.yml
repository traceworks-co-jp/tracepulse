name: Docker image

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
      - docker/**
      - docker-compose.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - package.json
      - package-lock.json
      - frontend/**
      - templates/**
      - config/services.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tracepulse:smoke
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke

      - name: Verify WebGUI and persistent data
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tracepulse-smoke -p 127.0.0.1:8080:8080 \
            --cap-drop ALL --cap-add NET_RAW \
            -v tracepulse-smoke-data:/data tracepulse:smoke
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/ -o /dev/null
          docker exec tracepulse-smoke test -s /data/data.db
          docker exec tracepulse-smoke test -s /data/config.toml
          # Bundled templates are embedded in the binary; only BYO templates need a runtime directory.
          docker exec tracepulse-smoke test ! -e /opt/tracepulse/templates
          docker exec tracepulse-smoke test -d /data/custom_templates
          docker exec tracepulse-smoke sh -c 'printf "\n# persistence smoke test\n" >> /data/config.toml'
          docker cp tracepulse-smoke:/data/config.toml /tmp/tracepulse-config.toml
          docker rm -f tracepulse-smoke
          docker run -d --name tracepulse-smoke -p 127.0.0.1:8080:8080 \
            --cap-drop ALL --cap-add NET_RAW \
            -v tracepulse-smoke-data:/data tracepulse:smoke
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/ -o /dev/null
          docker cp tracepulse-smoke:/data/config.toml /tmp/tracepulse-config-after.toml
          cmp /tmp/tracepulse-config.toml /tmp/tracepulse-config-after.toml
          docker exec tracepulse-smoke test -s /data/data.db

      - name: Show container logs
        if: failure()
        run: docker logs tracepulse-smoke

      - name: Clean up
        if: always()
        run: |
          docker rm -f tracepulse-smoke || true
          docker volume rm tracepulse-smoke-data || true

  publish:
    name: Publish amd64 and arm64 image to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tracepulse" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TracePulse
            org.opencontainers.image.description=Portable SNMP network monitoring with an embedded Web UI
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish