
<style>
    .destination-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .destination-card { min-width:0; padding:1rem; gap:.55rem; border:1px solid #52627a; border-radius:4px; background:#172338; }
    .destination-card:has(input[type='checkbox']:checked) { border-color:#38bdf8; }
    .destination-card h3 { margin:0 0 .25rem; padding-bottom:.6rem; border-bottom:1px solid #334155; color:#e2e8f0; }
    .destination-card label { display:flex; align-items:center; gap:.55rem; min-height:1.75rem; cursor:pointer; }
    .destination-card input[type='checkbox'] { flex:none; width:1rem; height:1rem; margin:0; padding:0; accent-color:#38bdf8; }
    .destination-card input:not([type='checkbox']), .destination-card select { width:100%; min-width:0; box-sizing:border-box; }
    html[data-theme='light'] .destination-card { background:#f8fafc; border-color:#94a3b8; }
    html[data-theme='light'] .destination-card:has(input[type='checkbox']:checked) { border-color:#0284c7; }
    html[data-theme='light'] .destination-card h3 { color:#0f172a; border-bottom-color:#cbd5e1; }
    @media (max-width:700px) { .destination-grid { grid-template-columns:1fr; } .destination-grid + .field-row { grid-template-columns:1fr; } .destination-grid ~ .actions { flex-wrap:wrap; } }
</style>
<section class='settings-section'><h2 data-i18n='notify_destinations'>Alerting &amp; Destinations</h2>
<div class='field-row destination-grid'>
    <div class='field-group destination-card'><h3>Slack</h3><label><input type='checkbox' id='slack_enabled'><span data-i18n='notify_enable_slack'>Enable Slack</span></label><input type='url' id='slack_url' placeholder='Webhook URL' data-i18n-placeholder='notify_webhook_url'><input type='text' id='slack_url_env' placeholder='TRACEPULSE_SLACK_WEBHOOK_URL'><button class='btn' onclick="testNotification('slack')" data-i18n='send_test'>Send Test Payload</button></div>
    <div class='field-group destination-card'><h3>Teams</h3><label><input type='checkbox' id='teams_enabled'><span data-i18n='notify_enable_teams'>Enable Teams</span></label><input type='url' id='teams_url' placeholder='Webhook URL' data-i18n-placeholder='notify_webhook_url'><input type='text' id='teams_url_env' placeholder='TRACEPULSE_TEAMS_WEBHOOK_URL'><button class='btn' onclick="testNotification('teams')" data-i18n='send_test'>Send Test Payload</button></div>
    <div class='field-group destination-card'><h3>Syslog</h3><label><input type='checkbox' id='syslog_enabled'><span data-i18n='notify_enable_syslog'>Enable Syslog</span></label><input type='text' id='syslog_host' placeholder='SIEM host or IP' data-i18n-placeholder='notify_siem_host'><input type='number' id='syslog_port' min='1' max='65535' placeholder='514'><select id='syslog_transport'><option value='udp'>UDP</option><option value='tcp'>TCP</option><option value='tls'>TLS</option></select><select id='syslog_format'><option value='cef'>CEF</option><option value='rfc5424'>RFC 5424</option><option value='rfc3164'>RFC 3164</option></select><input type='text' id='syslog_app_name' placeholder='App name' data-i18n-placeholder='notify_app_name'><button class='btn' onclick="testNotification('syslog')" data-i18n='send_test'>Send Test Payload</button></div>
    <div class='field-group destination-card'><h3 data-i18n='notify_generic_webhook'>Generic Webhook</h3><label><input type='checkbox' id='webhook_enabled'><span data-i18n='notify_enable_webhook'>Enable Webhook</span></label><input type='url' id='webhook_url' placeholder='https://example.invalid/hook'><input type='text' id='webhook_url_env' placeholder='TRACEPULSE_WEBHOOK_URL'><button class='btn' onclick="testNotification('webhook')" data-i18n='send_test'>Send Test Payload</button></div>
    <div class='field-group destination-card'><h3>SMTP</h3><label><input type='checkbox' id='smtp_enabled'><span data-i18n='notify_enable_smtp'>Enable SMTP</span></label><input type='text' id='smtp_host' placeholder='SMTP host' data-i18n-placeholder='notify_smtp_host'><input type='number' id='smtp_port' min='1' max='65535' placeholder='587'><input type='email' id='smtp_from' placeholder='From address' data-i18n-placeholder='notify_from_address'><input type='text' id='smtp_to' placeholder='Recipients, comma separated' data-i18n-placeholder='notify_recipients'><input type='text' id='smtp_username' placeholder='Username' data-i18n-placeholder='notify_username'><input type='text' id='smtp_password_env' placeholder='Password environment variable' data-i18n-placeholder='notify_password_env'><label><input type='checkbox' id='smtp_starttls' checked><span data-i18n='notify_starttls'>STARTTLS</span></label><button class='btn' onclick="testNotification('smtp')" data-i18n='send_test'>Send Test Payload</button></div>
</div>
<div class='field-row'><div class='field-group'><label data-i18n='flap_window'>Flap Guard Window (seconds)</label><input type='number' id='flap_window' min='0' max='3600'></div><div class='field-group'><label data-i18n='retry_max_attempts'>Retry Attempts</label><input type='number' id='retry_attempts' min='1' max='10'></div><div class='field-group'><label><input type='checkbox' id='send_resolved' checked><span data-i18n='notify_send_resolved'>Send [RESOLVED] recovery notifications</span></label></div></div>
<div class='actions'><button class='btn btn-primary' onclick='saveNotifications()' data-i18n='save_notifications'>Save Alerting Settings</button><button class='btn' onclick="testNotification('all')" data-i18n='send_test_all'>Test Enabled Destinations</button><span class='toast toast-ok' id='ntoast-ok'></span><span class='toast toast-err' id='ntoast-err'></span></div>
</section>
