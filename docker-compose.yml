services:
  tracepulse:
    image: ghcr.io/traceworks-co-jp/tracepulse:latest
    container_name: tracepulse
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Optional flow ingestion; match the ports configured in config.toml.
      # - "2055:2055/udp"
      # - "4739:4739/udp"
      # - "6343:6343/udp"
    # Recommended on native Linux for direct LAN SNMP/Ping/discovery access:
    # network_mode: host
    # Remove the entire ports section when enabling host networking.
    # Docker Desktop requires host networking support to be enabled explicitly.
    volumes:
      # Persists data.db, SQLite sidecars, encrypted config.toml, and secret.key.
      - tracepulse-data:/data
      # Alternative to the named volume: bind the whole writable data directory.
      # - ./data:/data
      # Do not bind config.toml alone: migration/settings use atomic replacement.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW

volumes:
  tracepulse-data: