name = "Juniper JunOS"
enterprise_id = 2636

[cpu]
candidates = [
    "1.3.6.1.4.1.2636.3.1.13.1.8", # JUNIPER-MIB::jnxOperatingCPU (Routing Engine / FPC)
]

[memory]
mode = "direct"
util_prefix = "1.3.6.1.4.1.2636.3.1.13.1.11" # JUNIPER-MIB::jnxOperatingBuffer (バッファ・メモリ使用率 %)

# -------------------------------------------------------------
# 1. 温度センサー (JUNIPER-MIB::jnxOperatingTable)
# -------------------------------------------------------------
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.2636.3.1.13.1.5" # jnxOperatingDescr
value_prefix = "1.3.6.1.4.1.2636.3.1.13.1.7" # jnxOperatingTemp (°C)
state_prefix = "1.3.6.1.4.1.2636.3.1.13.1.6" # jnxOperatingState

# -------------------------------------------------------------
# 2. ファン (JUNIPER-MIB::jnxOperatingTable: type .4)
# -------------------------------------------------------------
[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.2636.3.1.13.1.5.4" # jnxOperatingDescr (Fan)
state_prefix = "1.3.6.1.4.1.2636.3.1.13.1.6.4" # jnxOperatingState.4 (2: running, 6: down or off)

# -------------------------------------------------------------
# 3. 電源ユニット (JUNIPER-MIB::jnxOperatingTable: type .2)
# -------------------------------------------------------------
[[sensors.power]]
descr_prefix = "1.3.6.1.4.1.2636.3.1.13.1.5.2" # jnxOperatingDescr (Power Supply)
state_prefix = "1.3.6.1.4.1.2636.3.1.13.1.6.2" # jnxOperatingState.2 (2: running, 6: down or off)
fallback_builtin_power = false