name = "Ciena LEOS"
enterprise_id = 6141

[cpu]
candidates = [
    "1.3.6.1.4.1.6141.2.60.12.1.11.9.0", # WWP-LEOS-SYSTEM-CONFIG-MIB (60秒平均)
    "1.3.6.1.4.1.6141.2.60.12.1.7.3.0",  # WWP-LEOS-SYSTEM-CONFIG-MIB (15分平均)
]

[memory]
mode = "calculated"
used_prefix = "1.3.6.1.4.1.6141.2.60.12.1.13.1.0" # Used memory (KB)
free_prefix = "1.3.6.1.4.1.6141.2.60.12.1.13.4.0" # Available memory (KB)

# -------------------------------------------------------------
# 1. 温度センサー (WWP-LEOS-CHASSIS-MIB)
# -------------------------------------------------------------
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.5.1.1.1" # ChassisTempSensorName
value_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.5.1.1.2" # ChassisTempSensorValue (°C)

# -------------------------------------------------------------
# 2. ファン (WWP-LEOS-CHASSIS-MIB)
# -------------------------------------------------------------
[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.4.1.1.1" # ChassisFanName
state_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.4.1.1.3" # ChassisFanModuleStatus (1: ok, 2: pending, 3: failure)
speed_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.4.1.1.5" # ChassisFanCurrentSpeed (RPM)

# -------------------------------------------------------------
# 3. 電源ユニット (WWP-LEOS-CHASSIS-MIB)
# -------------------------------------------------------------
[[sensors.power]]
descr_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.3.1.1.1" # ChassisPowerSupplyName
state_prefix = "1.3.6.1.4.1.6141.2.60.11.1.1.3.1.1.2" # ChassisPowerSupplyState (1: online, 2: offline, 3: faulted)
fallback_builtin_power = false