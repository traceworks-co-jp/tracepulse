name = "HPE ProCurve AOS-S"
description = "HPE AOS-S CPU and local memory capacity readings"
enterprise_id = 11

[cpu]
candidates = ["1.3.6.1.4.1.11.2.14.11.5.1.9.6.1.0"]

# Calculate used bytes and utilization by matching total/free table row indexes.
[memory]
mode = "calculated"
free_oid = "1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.6"
total_oid = "1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.5"
used_is_bytes = true

# Keep raw capacities available as extra metrics as well as derived memory usage.
[[metrics]]
key = "memory_total_bytes"
oid = "1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.5"
unit = "bytes"
label = "Memory Total"
data_type = "gauge"

[[metrics]]
key = "memory_free_bytes"
oid = "1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.6"
unit = "bytes"
label = "Memory Free"
data_type = "gauge"