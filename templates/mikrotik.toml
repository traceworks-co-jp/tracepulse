[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.14988.1.1.3.10" # MIKROTIK-MIB::mtxrHlTemperature (基板/デバイス温度)
value_prefix = "1.3.6.1.4.1.14988.1.1.3.10"

# -------------------------------------------------------------
# 2. ファン (MIKROTIK-MIB)
# -------------------------------------------------------------
[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.14988.1.1.3.9"  # MIKROTIK-MIB::mtxrHlFanSpeed (RPM)
