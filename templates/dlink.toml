name = "D-Link Switch (DES / DGS Series)"
enterprise_id = 171

[cpu]
candidates = [
    "1.3.6.1.4.1.171.12.1.1.6.2.0",    # DLINK-AGENT-MIB::agentCPUutilizationIn1min.0
    "1.3.6.1.4.1.171.10.97.2.36.1.1.3.0", # MY-PROCESS-MIB::myCPUUtilization5Min.0 (DES-7200)
]

[memory]
mode = "direct"
util_prefix = "1.3.6.1.4.1.171.12.1.1.9.1.4" # DLINK-AGENT-MIB::agentDRAMutilization

# -------------------------------------------------------------
# 1. 温度センサー
# -------------------------------------------------------------
# パターン1: EQUIPMENT-MIB (DES / DGS シリーズ標準)
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.171.12.11.1.8.1.1" # swTemperatureUnitIndex
value_prefix = "1.3.6.1.4.1.171.12.11.1.8.1.2" # swTemperatureCurrent (°C)

# パターン2: MY-SYSTEM-MIB (DES-7200 シリーズ)
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.171.10.97.2.1.1.23.1.2"
value_prefix = "1.3.6.1.4.1.171.10.97.2.1.1.23.1.3"

# -------------------------------------------------------------
# 2. ファン
# -------------------------------------------------------------
# パターン1: EQUIPMENT-MIB (1: working, 2: fail, 3-6: speed 0/low/mid/high)
[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.171.12.11.1.7.1.2" # swFanID
state_prefix = "1.3.6.1.4.1.171.12.11.1.7.1.3" # swFanStatus

# パターン2: MY-SYSTEM-MIB (4: normal, 5: powerbutabnormal)
[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.171.10.97.2.1.1.21.1.3"
state_prefix = "1.3.6.1.4.1.171.10.97.2.1.1.21.1.2"

# -------------------------------------------------------------
# 3. 電源ユニット
# -------------------------------------------------------------
# パターン1: EQUIPMENT-MIB (3: working, 4: fail)
[[sensors.power]]
descr_prefix = "1.3.6.1.4.1.171.12.11.1.6.1.2" # swPowerID
state_prefix = "1.3.6.1.4.1.171.12.11.1.6.1.3" # swPowerStatus
fallback_builtin_power = false

# パターン2: MY-SYSTEM-MIB (4: normal, 5: powerbutabnormal)
[[sensors.power]]
descr_prefix = "1.3.6.1.4.1.171.10.97.2.1.1.18.1.3"
state_prefix = "1.3.6.1.4.1.171.10.97.2.1.1.18.1.2"
fallback_builtin_power = false