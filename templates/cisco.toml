name = "Cisco Network Device"
description = "CPU percentage, enhanced/legacy memory pools, and FRU power state"
enterprise_id = 9

# CISCO-ENTITY-SENSOR-MIB + ENTITY-MIB; never equate entPhysicalIndex with ifIndex.
[tables.dom]
base_oid = "1.3.6.1.4.1.9.9.91.1.1.1.1"

[tables.dom.entity]
name_oid = "1.3.6.1.2.1.47.1.1.1.1.7"
contained_in_oid = "1.3.6.1.2.1.47.1.1.1.1.4"
alias_oid = "1.3.6.1.2.1.47.1.3.2.1.2"
type_oid = "1.3.6.1.4.1.9.9.91.1.1.1.1.1"
scale_oid = "1.3.6.1.4.1.9.9.91.1.1.1.1.2"
precision_oid = "1.3.6.1.4.1.9.9.91.1.1.1.1.3"
status_oid = "1.3.6.1.4.1.9.9.91.1.1.1.1.5"

[[tables.dom.metrics]]
key = "rx_power"
oid = "1.3.6.1.4.1.9.9.91.1.1.1.1.4"
unit = "dBm"
label = "Rx Power"
match_names = ["receive power", "rx power"]
invalid_values = [-1000000000, 1000000000]

[[tables.dom.metrics]]
key = "tx_power"
oid = "1.3.6.1.4.1.9.9.91.1.1.1.1.4"
unit = "dBm"
label = "Tx Power"
match_names = ["transmit power", "tx power"]
invalid_values = [-1000000000, 1000000000]

# Sources and selection semantics: docs/design/03-snmp-collection.md
[cpu]
candidates = [
    "1.3.6.1.4.1.9.9.109.1.1.1.1.7", # cpmCPUTotal1minRev
    "1.3.6.1.4.1.9.9.109.1.1.2.1.4", # cpmCore1min
    "1.3.6.1.4.1.9.2.1.57.0",        # avgBusy1
]
aggregation = "max"

[memory]
mode = "calculated"
used_prefix = "1.3.6.1.4.1.9.9.221.1.1.1.1.7"
free_prefix = "1.3.6.1.4.1.9.9.221.1.1.1.1.8"
used_is_bytes = true

[[memory.fallbacks]]
mode = "calculated"
used_prefix = "1.3.6.1.4.1.9.9.48.1.1.1.5"
free_prefix = "1.3.6.1.4.1.9.9.48.1.1.1.6"
used_is_bytes = true

[[sensors.power]]
descr_prefix = "1.3.6.1.2.1.47.1.1.1.1.7"
state_prefix = "1.3.6.1.4.1.9.9.117.1.1.2.1.2"
normal_states = [2]
alarm_states = [4, 5, 6, 7, 8, 9, 10, 11, 12]
state_labels = { "1" = "Off (other)", "2" = "On", "3" = "Administratively off", "4" = "Power denied", "5" = "Off (power)", "6" = "Off (temperature)", "7" = "Off (fan)", "8" = "Failed", "9" = "On (fan failure)", "10" = "Off (cooling)", "11" = "Off (connector rating)", "12" = "On (inline power failure)" }
