name = "Cisco Systems"
enterprise_id = 9

[cpu]
candidates = [
    "1.3.6.1.4.1.9.9.109.1.1.1.1.8", # CISCO-PROCESS-MIB::cpmCPUTotal5minRev (インデックス指定値)
    "1.3.6.1.4.1.9.9.109.1.1.1.1.5", # CISCO-PROCESS-MIB::cpmCPUTotal5minRev (スカラ値)
    "1.3.6.1.4.1.9.2.1.57.0",        # OLD-CISCO-CPU-MIB::avgBusy1
]

[memory]
mode = "calculated"
used_prefix = "1.3.6.1.4.1.9.9.48.1.1.1.5" # CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolUsed
free_prefix = "1.3.6.1.4.1.9.9.48.1.1.1.6" # CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolFree

# -------------------------------------------------------------
# パターン1: 従来型 Cisco 機器（CISCO-ENVMON-MIB）
# -------------------------------------------------------------
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.9.9.13.1.3.1.2" # ciscoEnvMonTemperatureDescr
value_prefix = "1.3.6.1.4.1.9.9.13.1.3.1.3" # ciscoEnvMonTemperatureValue (°C)
state_prefix = "1.3.6.1.4.1.9.9.13.1.3.1.6" # ciscoEnvMonTemperatureState

[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.9.9.13.1.4.1.2" # ciscoEnvMonFanStatusDescr
state_prefix = "1.3.6.1.4.1.9.9.13.1.4.1.3" # ciscoEnvMonFanState

[[sensors.power]]
descr_prefix = "1.3.6.1.4.1.9.9.13.1.5.1.2" # ciscoEnvMonSupplyStatusDescr
state_prefix = "1.3.6.1.4.1.9.9.13.1.5.1.3" # ciscoEnvMonSupplyState
fallback_builtin_power = true

# -------------------------------------------------------------
# パターン2: FRU コントロール機器（CISCO-ENTITY-FRU-CONTROL-MIB）
# -------------------------------------------------------------
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.9.9.117.1.1.1.1.1" # cefcModuleOperStatus
value_prefix = "1.3.6.1.4.1.9.9.117.1.1.1.1.2"
state_prefix = "1.3.6.1.4.1.9.9.117.1.1.1.1.3"

# -------------------------------------------------------------
# パターン3: 新世代・標準エンティティ（CISCO-ENTITY-SENSOR-MIB）
# -------------------------------------------------------------
[[sensors.temperature]]
descr_prefix = "1.3.6.1.2.1.47.1.1.1.1.7"     # ENTITY-MIB::entPhysicalName
value_prefix = "1.3.6.1.4.1.9.9.91.1.1.1.1.4" # CISCO-ENTITY-SENSOR-MIB::entSensorValue
state_prefix = "1.3.6.1.4.1.9.9.91.1.1.1.1.5" # CISCO-ENTITY-SENSOR-MIB::entSensorStatus