name = "Palo Alto Networks PAN-OS"
enterprise_id = 25461

[cpu]
candidates = [
    "1.3.6.1.4.1.25461.2.1.2.3.1.0", # PAN-COMMON-MIB::panGPCpuUtilization (Management/Data Plane 総合)
    "1.3.6.1.2.1.25.3.3.1.2",        # HOST-RESOURCES-MIB::hrProcessorLoad
]

[memory]
mode = "direct"
util_prefix = "1.3.6.1.4.1.25461.2.1.2.3.2.0" # PAN-COMMON-MIB::panGPMemoryUtilization (%)

# -------------------------------------------------------------
# 1. 温度センサー (PAN-COMMON-MIB::panChassisThermalTable)
# -------------------------------------------------------------
[[sensors.temperature]]
descr_prefix = "1.3.6.1.4.1.25461.2.1.2.2.1.2" # panChassisThermalDescr
value_prefix = "1.3.6.1.4.1.25461.2.1.2.2.1.3" # panChassisThermalDegreesC (°C)

# -------------------------------------------------------------
# 2. ファン (PAN-COMMON-MIB::panChassisFanTable)
# -------------------------------------------------------------
[[sensors.fan]]
descr_prefix = "1.3.6.1.4.1.25461.2.1.2.1.1.2" # panChassisFanDescr
state_prefix = "1.3.6.1.4.1.25461.2.1.2.1.1.3" # panChassisFanState (1: ok, 2: error)

# -------------------------------------------------------------
# 3. 電源ユニット (PAN-COMMON-MIB::panChassisPowerTable)
# -------------------------------------------------------------
[[sensors.power]]
descr_prefix = "1.3.6.1.4.1.25461.2.1.2.1.2.2" # panChassisPowerDescr
state_prefix = "1.3.6.1.4.1.25461.2.1.2.1.2.3" # panChassisPowerState (1: ok, 2: error)
fallback_builtin_power = false