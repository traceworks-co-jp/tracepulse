[alert]
health_critical_threshold = 60
health_warning_threshold = 80
spike_threshold = 10

[alert.bandwidth]
critical = 90.0
warning = 80.0

[alert.cpu]
critical = 90.0
warning = 80.0

[alert.error_rate]
critical = 10.0
warning = 5.0

[alert.memory]
critical = 90.0
warning = 80.0

[display]
