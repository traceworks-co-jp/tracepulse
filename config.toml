[alert]
error_rate_threshold = 0.05
health_critical_threshold = 60
health_warning_threshold = 70
spike_threshold = 10

[alert.bandwidth]
critical = 90.0
warning = 80.0

[alert.cpu]
critical = 90.0
warning = 80.0

[alert.error_rate]
critical = 10.0
warning = 5.0

[alert.memory]
critical = 90.0
warning = 80.0

[display]
timezone = "jst"

[flow]
bind_addr = "0.0.0.0"
ipfix_port = 4739
netflow_port = 2055
sflow_port = 6343

[notifier]
send_resolved = true

[notifier.flap_guard]
window_seconds = 10

[notifier.pagerduty]
enabled = false
endpoint = "https://events.pagerduty.com/v2/enqueue"
integration_key_env = "TRACEPULSE_PAGERDUTY_ROUTING_KEY"

[notifier.retry]
max_attempts = 3

[notifier.slack]
enabled = false
webhook_url_env = "TRACEPULSE_SLACK_WEBHOOK_URL"

[notifier.smtp]
enabled = false
from = "tracepulse@localhost"
host = "127.0.0.1"
port = 587
starttls = true
to = []

[notifier.syslog]
app_name = "tracepulse"
enabled = false
format = "cef"
host = "127.0.0.1"
port = 514
transport = "udp"

[notifier.teams]
enabled = false
webhook_url_env = "TRACEPULSE_TEAMS_WEBHOOK_URL"

[notifier.webhook]
enabled = false
webhook_url_env = "TRACEPULSE_WEBHOOK_URL"

[polling]
interval_seconds = 30

[retention]
history_days = 30

[snmp]
cpu_oid_override = ""
credentials_encrypted = "tpenc:v1:"
default_community = "tpenc:v1:fDk4FY/uPqegup72ca0/AZqKCrK4jVWMOWb3KPkNjKZMsQCid1kitWka0bOBXIc9TfVlRy39R+HgLm1nLmr9m1HOhFl080KbFyn7P6uX6iXOXW3No8a7k2WFRr1r1Q=="
hardware_oid_overrides = []
memory_oid_override = ""

[web]
port = 8080
